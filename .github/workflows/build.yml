name: Build AutoTotem Mod (Fabric 1.21.10)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: Generate mod project
        run: |
          set -euo pipefail

          MC="1.21.10"

          YARN=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/yarn/${MC}" | jq -r '.[0].version') || true
          LOADER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[] | select(.stable == true)][0].version') || true
          FAPI=$(curl -fsSL "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -o "<version>[^<]*+${MC}</version>" | sed -e 's/<version>//' -e 's/<\/version>//' | tail -n 1) || true

          echo "Yarn   : ${YARN}"
          echo "Loader : ${LOADER}"
          echo "FabricAPI: ${FAPI}"

          if [ -z "${YARN}" ] || [ "${YARN}" = "null" ]; then echo "Yarn version tidak ketemu"; exit 1; fi
          if [ -z "${LOADER}" ] || [ "${LOADER}" = "null" ]; then echo "Loader version tidak ketemu"; exit 1; fi
          if [ -z "${FAPI}" ]; then echo "Fabric API version tidak ketemu"; exit 1; fi

          mkdir -p mod
          cd mod

          printf '%s\n' \
            "org.gradle.jvmargs=-Xmx2G" \
            "org.gradle.parallel=true" \
            "minecraft_version=${MC}" \
            "yarn_mappings=${YARN}" \
            "loader_version=${LOADER}" \
            "fabric_version=${FAPI}" \
            > gradle.properties

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'autototem'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.12-SNAPSHOT'
          }

          base {
              archivesName = 'autototem'
          }

          version = '1.0.0'
          group = 'com.example.autototem'

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 21
              options.encoding = 'UTF-8'
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          mkdir -p src/main/resources
          mkdir -p src/main/java/com/example/autototem

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "autototem",
            "version": "1.0.0",
            "name": "Auto Totem",
            "description": "Buka inventory: totem otomatis dipasang ke offhand kalau offhand kosong. Toggle: tombol ` atau /autototem",
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.example.autototem.AutoTotemClient"]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "1.21.10",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/java/com/example/autototem/AutoTotemClient.java <<'EOF'
          package com.example.autototem;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.screen.ingame.InventoryScreen;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.item.Items;
          import net.minecraft.screen.PlayerScreenHandler;
          import net.minecraft.screen.ScreenHandler;
          import net.minecraft.screen.slot.SlotActionType;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          public class AutoTotemClient implements ClientModInitializer {
              private static boolean enabled = true;
              private static boolean wasInventoryOpen = false;
              private static boolean toggleWasDown = false;

              @Override
              public void onInitializeClient() {
                  // Toggle lewat command (selain tombol ` di sebelah kiri angka 1)
                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) ->
                      dispatcher.register(ClientCommandManager.literal("autototem").executes(context -> {
                          enabled = !enabled;
                          context.getSource().sendFeedback(Text.literal("AutoTotem: " + (enabled ? "ON" : "OFF")));
                          return 1;
                      }))
                  );

                  ClientTickEvents.START_CLIENT_TICK.register(AutoTotemClient::tick);
              }

              private static void tick(MinecraftClient client) {
                  ClientPlayerEntity player = client.player;
                  if (player == null || client.world == null) {
                      wasInventoryOpen = false;
                      return;
                  }

                  // Tombol toggle: ` (sebelah kiri angka 1). Cuma aktif kalau nggak lagi chat / buka menu.
                  long window = GLFW.glfwGetCurrentContext();
                  if (window != 0L) {
                      boolean down = GLFW.glfwGetKey(window, GLFW.GLFW_KEY_GRAVE_ACCENT) == GLFW.GLFW_PRESS;
                      if (down && !toggleWasDown && client.currentScreen == null) {
                          enabled = !enabled;
                          player.sendMessage(Text.literal("AutoTotem: " + (enabled ? "ON" : "OFF")), true);
                      }
                      toggleWasDown = down;
                  }

                  // Pas inventory baru kebuka -> pasang totem ke offhand kalau offhand kosong
                  boolean open = client.currentScreen instanceof InventoryScreen;
                  if (open && !wasInventoryOpen && enabled) {
                      equipTotem(client, player);
                  }
                  wasInventoryOpen = open;
              }

              private static void equipTotem(MinecraftClient client, ClientPlayerEntity player) {
                  if (client.interactionManager == null) {
                      return;
                  }
                  if (!player.getOffHandStack().isEmpty()) {
                      return;
                  }
                  ScreenHandler handler = player.currentScreenHandler;
                  if (!(handler instanceof PlayerScreenHandler)) {
                      return;
                  }
                  // Slot 9-35 = inventory utama, 36-44 = hotbar
                  for (int i = 9; i <= 44 && i < handler.slots.size(); i++) {
                      if (handler.getSlot(i).getStack().isOf(Items.TOTEM_OF_UNDYING)) {
                          // Tombol 40 = tukar dengan offhand (sama kayak tekan F di inventory)
                          client.interactionManager.clickSlot(handler.syncId, i, 40, SlotActionType.SWAP, player);
                          return;
                      }
                  }
              }
          }
          EOF

          echo "Struktur project:"
          find . -type f | sort

      - name: Build
        working-directory: mod
        run: |
          set +e
          for LOOM in 1.12-SNAPSHOT 1.13-SNAPSHOT; do
            echo "=== Coba Loom ${LOOM} ==="
            sed -i "s/id 'fabric-loom' version '[^']*'/id 'fabric-loom' version '${LOOM}'/" build.gradle
            if gradle build --no-daemon --stacktrace; then
              echo "Build sukses dengan Loom ${LOOM}"
              exit 0
            fi
          done
          echo "Semua percobaan build gagal"
          exit 1

      - name: Prepare jar
        run: |
          mkdir -p dist
          cp mod/build/libs/autototem-1.0.0.jar dist/autototem-1.0.0-mc1.21.10.jar

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoTotem-1.21.10
          path: dist/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: AutoTotem-1.21.10
          path: dist

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autototem-v1.0.0-mc1.21.10
          target_commitish: ${{ github.sha }}
          name: "Auto Totem v1.0.0 (Minecraft 1.21.10)"
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/*.jar
          body: |
            # Auto Totem v1.0.0 (Minecraft 1.21.10)

            Mod client-side (Fabric) untuk Minecraft 1.21.10.
            Saat inventory dibuka dan offhand kosong, totem of undying dari inventory otomatis dipasang ke offhand.

            Download: `autototem-1.0.0-mc1.21.10.jar`
            Butuh Fabric Loader dan Fabric API.

            ## Cara pakai
            - Buka inventory (E). Kalau offhand kosong dan ada totem, totem langsung masuk offhand.
            - Toggle ON/OFF: tombol ` (di kiri angka 1) saat main, atau ketik `/autototem`. Default ON.
